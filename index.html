<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Responsivo - Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="layout">
    <!-- Bloco Superior (a, b) -->
    <div class="layout__row layout__row--top">
      <div class="layout__item">a</div>
      <div class="layout__item">b</div>
    </div>

    <!-- Bloco Central (c, d, f) -->
    <div class="layout__row layout__row--middle">
      <div class="layout__item">c</div>
      <div class="layout__item">d</div>
      <div class="layout__item">f</div>
    </div>

    <!-- Bloco Inferior (g) -->
    <div class="layout__row layout__row--bottom">
      <div class="layout__item">g</div>
    </div>
  </main>

</body>
</html>
